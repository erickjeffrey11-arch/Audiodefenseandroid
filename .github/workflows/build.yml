name: Build the Audio Defence APK

# Runs by itself whenever files are uploaded, and by hand from the Actions tab ("Run workflow").
# The steps of the build itself are in ci/build.sh, inside the uploaded project.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get this project
        uses: actions/checkout@v4

      - name: Unpack the project when it was uploaded as one zip file
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "unpacking $z"
            unzip -q -o "$z" -d /tmp/unpacked
            cp -r /tmp/unpacked/*/. .
          done
          ls

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python for the build (Chaquopy needs the same version the app uses)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Get the game's data and build the app
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: bash ci/build.sh

      - name: Keep the APK where it can be downloaded
        uses: actions/upload-artifact@v4
        with:
          name: AudioDefence-Android-Release
          path: out/*.apk
          if-no-files-found: error
